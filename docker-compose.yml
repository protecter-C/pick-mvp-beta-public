services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pick
      POSTGRES_USER: pick
      POSTGRES_PASSWORD: pick
    ports: ["5432:5432"]
    volumes: [pick_postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pick_postgres:
